name: Build and Publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simlink-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out app source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # AI Studio sync omits the wrapper executable and JAR.
          # Keep this version aligned with gradle-wrapper.properties.
          gradle-version: '9.3.1'

      - name: Restore CI debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.SIMLINK_CI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::SIMLINK_CI_DEBUG_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SimLink-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs SimLink-debug.apk

      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "A newer commit is on main. Skipping publication."
            exit 0
          fi

          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            SimLink-debug.apk \
            --target "$GITHUB_SHA" \
            --title "SimLink debug build ${GITHUB_RUN_NUMBER}" \
            --notes "Signed debug APK for testing. Source commit: $GITHUB_SHA." \
            --draft

          expected_digest="sha256:$(sha256sum SimLink-debug.apk | cut -d ' ' -f 1)"
          uploaded_digest=$(gh release view "$tag" --json assets \
            --jq '.assets[] | select(.name == "SimLink-debug.apk" and .state == "uploaded") | .digest')
          if [[ "$uploaded_digest" != "$expected_digest" ]]; then
            echo "::error::The uploaded APK digest does not match the verified build."
            exit 1
          fi
          gh release edit "$tag" --draft=false --latest

          # Retire only previous releases created by this workflow.
          old_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            .[] | select(
              .author.login == "github-actions[bot]" and
              (.tag_name | test("^build-[0-9]+-[0-9]+$")) and
              (.name | startswith("SimLink debug build "))
            ) | .tag_name')
          while IFS= read -r old_tag; do
            if [[ -n "$old_tag" && "$old_tag" != "$tag" ]]; then
              gh release delete "$old_tag" --yes
            fi
          done <<< "$old_tags"
