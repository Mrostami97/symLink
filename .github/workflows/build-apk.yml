
name: Build and Publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android Project
        run: |
          echo "Searching project files..."
          ls -la

          find . -name "build.gradle*"
          find . -name "settings.gradle*"
          find . -name "gradlew"

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "::error::Gradle wrapper not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          mkdir -p release-files

          find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -exec cp {} release-files/ \;

          if ! compgen -G "release-files/*.apk" > /dev/null; then
            echo "::error::APK file not found!"
            exit 1
          fi

          ls -lh release-files/

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            release-files/*.apk \
            --target "$GITHUB_SHA" \
            --title "Version ${GITHUB_RUN_NUMBER}" \
            --generate-notes \
            --prerelease
