name: Build and Publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out app source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # AI Studio sync omits the wrapper executable and JAR.
          # Keep this version aligned with gradle-wrapper.properties.
          gradle-version: '9.3.1'

      - name: Restore CI debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.SIMLINK_CI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::SIMLINK_CI_DEBUG_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SimLink-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs SimLink-debug.apk

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            SimLink-debug.apk \
            --target "$GITHUB_SHA" \
            --title "SimLink debug build ${GITHUB_RUN_NUMBER}" \
            --generate-notes \
            --prerelease
